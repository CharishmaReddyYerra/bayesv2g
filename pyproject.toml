[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bayesv2g"
version = "0.1.0"
description = "Bayesian variant-to-gene prioritization from fine-mapped GWAS and functional genomics evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BayesV2G contributors" }]
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
data = [
  "pysam>=0.23,<0.24",
]
download = [
  "huggingface-hub>=1,<3",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
bayesv2g = "bayesv2g.cli:main"

[project.urls]
Homepage = "https://bayesv2g-evidence-workbench.sibunnu.chatgpt.site"
Repository = "https://github.com/CharishmaReddyYerra/bayesv2g"

[tool.hatch.build.targets.wheel]
packages = ["src/bayesv2g"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
